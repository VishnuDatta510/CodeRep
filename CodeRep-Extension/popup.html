<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeRep</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">
            <img src="icons/icon48.png" width="32" height="32" alt="Logo" />
          </div>
          <div class="logo-text">
            <h1>CodeRep</h1>
            <span>Spaced Repetition</span>
          </div>
          <!-- Status Badge -->
          <div id="header-status" class="header-status" style="display: none">
            <span class="status-dot-small"></span>
          </div>
        </div>
      </header>

      <!-- Auth Section (Logged Out) -->
      <div id="auth-section" class="section">
        <div id="logged-out">
          <div class="auth-card">
            <div class="auth-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"
                  fill="currentColor"
                />
              </svg>
            </div>
            <h2>Connect Your Account</h2>
            <p>
              Enter your API token to sync your LeetCode problems with CodeRep.
            </p>

            <div class="input-wrapper">
              <input
                type="password"
                id="api-token"
                placeholder="Paste your API token"
                autocomplete="off"
              />
              <div class="input-underline"></div>
            </div>

            <button id="save-token" class="btn btn-primary">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
              <span>Connect Account</span>
            </button>

            <a href="#" id="get-token-link" class="link">
              <span>Get your API token</span>
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="7" y1="17" x2="17" y2="7" />
                <polyline points="7 7 17 7 17 17" />
              </svg>
            </a>
          </div>
        </div>

        <!-- Logged In Section -->
        <div id="logged-in" style="display: none">
          <!-- Today's Problems -->
          <div class="today-section">
            <div class="section-header">
              <h2>Today's Reviews</h2>
              <span id="problem-count" class="count-badge">0</span>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="state-container">
              <div class="loading-spinner"></div>
              <p class="state-text">Loading your problems...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="state-container" style="display: none">
              <div class="state-icon success">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20 6L9 17l-5-5"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <p class="state-title">All Caught Up!</p>
              <p class="state-subtitle">No problems due for review today.</p>
            </div>

            <!-- Error State -->
            <div id="error-state" class="state-container" style="display: none">
              <div class="state-icon error">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                  <circle
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <line
                    x1="12"
                    y1="8"
                    x2="12"
                    y2="12"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="12"
                    y1="16"
                    x2="12.01"
                    y2="16"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <p class="state-title">Failed to load</p>
              <button id="retry-btn" class="btn btn-secondary btn-sm">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                <span>Try Again</span>
              </button>
            </div>

            <!-- Problems List -->
            <div id="problems-list" class="problems-list"></div>
          </div>

          <!-- Quick Actions -->
          <div class="quick-actions">
            <button id="open-dashboard" class="action-btn primary">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
              </svg>
              <span>Dashboard</span>
            </button>
            <button id="refresh-btn" class="action-btn icon" title="Refresh">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
            </button>
            <button id="settings-btn" class="action-btn icon" title="Settings">
              <img src="settings.png" width="18" height="18" alt="Settings" />
            </button>
            <button
              id="logout-btn"
              class="action-btn icon danger"
              title="Disconnect"
            >
              <img
                src="disconnect.png"
                width="18"
                height="18"
                alt="Disconnect"
              />
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <a href="#" id="visit-site" class="footer-link">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          <span>CodeRep</span>
        </a>
        <span class="version">v1.0.0</span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
